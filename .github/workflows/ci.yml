name: CI — lint, test, build, deploy

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + typecheck + unit/integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Integration tests (auth, wallet, tournaments, results, admin)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing — build failed"; exit 1; }
          test -s dist/index.html || { echo "::error::dist/index.html is empty"; exit 1; }
          find dist/assets -name '*.js' -size +0c | grep -q . || { echo "::error::no JS bundles emitted"; exit 1; }
          echo "Build artefacts verified."
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  functions:
    name: Validate Firebase functions bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - run: node build.mjs && node --check index.js && node --check shared/app.js
        working-directory: functions
      - name: Firebase config sanity check
        run: |
          node -e "const fs=require('fs');for(const f of ['firebase.json','firestore.indexes.json']){JSON.parse(fs.readFileSync(f,'utf8'));}for(const f of ['firestore.rules','storage.rules']){if(fs.statSync(f).size<100)throw new Error(f+' is empty');}console.log('Firebase config validated');"

  deploy:
    name: Deploy (only when secrets are configured)
    needs: [quality, functions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build
      - name: Deploy static web build to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Skip notice
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: echo "No deployment secrets configured — build verified only. See docs/DEPLOYMENT.md"
